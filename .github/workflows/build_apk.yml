name: Build Dev APK

on:
  workflow_dispatch: # Allows you to manually trigger the build from GitHub UI
  push:
    branches: [ "master" ] # Optional: auto build on push to master

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean workspace
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Build Dev APK
        run: flutter build apk --release -t lib/main_dev.dart --dart-define-from-file=config/dev.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-apk
          path: build/app/outputs/flutter-apk/app-release.apk
